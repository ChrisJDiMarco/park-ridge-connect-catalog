name: Update Park Ridge Place Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: park-ridge-place-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh OpenStreetMap catalog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build catalog
        run: |
          python3 Tools/place-directory/build_catalog.py \
            --output docs/place-directory/park-ridge-places.json \
            --fallback-input docs/place-directory/park-ridge-places.json \
            --supplemental-input docs/place-directory/park-ridge-supplemental-places.json \
            --minimum-places 20
          python3 -m json.tool docs/place-directory/park-ridge-places.json >/tmp/park-ridge-places.json

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- docs/place-directory/park-ridge-places.json; then
            echo "No place catalog changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/place-directory/park-ridge-places.json
          git commit -m "Update Park Ridge place catalog"
          git push
